<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pflegekarte · fren studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F2F0E8; --ink:#1E2A22; --muted:#4D5A50; --line:#E6E3D8; --blue:#2C6E9B; --blue-soft:#DCEAF3;
          --green:#1E3D27; --green-soft:#DDEBDD; --red:#7C2D12; --red-soft:#FBE3D6; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; }
  a { color: #2F5D3A; } a:hover { color: var(--green); }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .display { font-family: 'Bricolage Grotesque', sans-serif; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .02em; text-transform: none; color: var(--ink); }
  h1 { margin: 6px 0 0; font-weight: 800; font-size: 56px; line-height: .95; letter-spacing: -.02em; }
  .sub { font-size: 18px; color: var(--muted); margin-top: 4px; }
  .card { background: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 rgba(30,42,34,.06); }
  .head { display: flex; align-items: center; gap: 12px; }
  .icon { width: 48px; height: 48px; border-radius: 16px; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  h2 { margin: 0; font-weight: 700; font-size: 30px; line-height: 1.05; }
  .lead { margin: 0; font-size: 21px; line-height: 1.35; }
  .rhythm { display: flex; align-items: center; gap: 10px; background: var(--blue); color: #fff; border-radius: 16px; padding: 12px 16px; }
  .rhythm small { font-size: 14px; opacity: .9; display: block; }
  .rhythm b { font-size: 20px; }
  .note { font-size: 16px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .tile { background: #fff; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .tile .t { font-weight: 700; font-size: 19px; line-height: 1.15; }
  .tile .d { font-size: 17px; line-height: 1.3; }
  .tile.bad { background: var(--red-soft); color: var(--red); }
  .tile.good { background: var(--green-soft); color: var(--green); }
  details { background: #fff; border-radius: 20px; overflow: hidden; }
  summary { min-height: 60px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  details[open] .chev { transform: rotate(180deg); }
  .more { padding: 0 18px 18px; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row span { color: var(--muted); } .row strong { text-align: right; }
  .dd { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .dd > div { border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .do { background: var(--green-soft); } .do strong { color: var(--green); }
  .dont { background: var(--red-soft); } .dont strong { color: var(--red); }
  .warn { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; }
  .foot { text-align: center; font-size: 14px; color: var(--muted); padding-top: 4px; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
// Care data per plant. The URL picks one: ?p=nep
var PLANTS = {
  nep: {
    name: 'Bernd',
    species: 'Nepenthes · Kannenpflanze',
    check: 'Finger 1 cm in die Erde: <strong>nur noch leicht feucht?</strong> Dann ja. Nie ganz austrocknen lassen.',
    summer: 'etwa alle 2–3 Tage',
    winter: 'etwa alle 4–6 Tage',
    water: 'Am besten Regen- oder destilliertes Wasser. Robuste Kannenpflanzen aus dem Baumarkt vertragen auch Leitungswasser.',
    toxic: false,
    facts: [
      ['Pflegeleicht', 'Mittel'],
      ['Licht', 'Hell, keine pralle Mittagssonne'],
      ['Gießen Sommer', 'alle 2–3 Tage'],
      ['Gießen Winter', 'alle 4–6 Tage'],
      ['Erde', 'Leicht feucht halten'],
      ['Hält Urlaub aus?', 'Kaum – max. 1 Woche'],
      ['Staunässe', 'Vermeiden'],
      ['Luftfeuchte', 'Hoch, ab 60 %'],
      ['Mindesttemperatur', '15 °C'],
      ['Düngen', 'Nicht in die Erde. Apr–Sep ab und zu ein Insekt in die Kanne']
    ],
    dos: ['Kalkfreies Wasser', 'Hell &amp; warm stellen', 'Öfter besprühen'],
    donts: ['Leitungswasser', 'Normale Blumenerde', 'Kannen anfassen'],
    warnings: [
      ['Keine neuen Kannen', 'Luft zu trocken oder zu dunkel'],
      ['Braune Blattspitzen', 'Kalk im Wasser'],
      ['Schwarzer Stängel unten', 'zu nass']
    ]
  }
};

var ICON = {
  drop: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2C6E9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7c3.4 4 6 7.3 6 10.8a6 6 0 0 1-12 0c0-3.5 2.6-6.8 6-10.8z"/></svg>',
  cal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  pot: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1.6 11a2 2 0 0 1-2 1.7H7.6a2 2 0 0 1-2-1.7z"/><path d="M9 4.5c1 1 2 1 3 0s2-1 3 0"/><path d="M12 11v5M10 14l2 2 2-2"/></svg>',
  warn: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>',
  shield: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F5D3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 4.5 5.8v5.6c0 4.6 3.1 8.2 7.5 9.8 4.4-1.6 7.5-5.2 7.5-9.8V5.8z"/><path d="m8.6 12 2.4 2.4 4.4-4.6"/></svg>',
  chev: '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
};

var MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function render() {
  var key = new URLSearchParams(location.search).get('p') || 'nep';
  var p = PLANTS[key];
  var app = document.getElementById('app');
  var top = '<div class="top"><span class="display brand">fren studio</span><span>Pflegekarte</span></div>';
  if (!p) {
    app.innerHTML = top + '<h1 class="display">Hmm.</h1><p class="lead">Diese Pflanze kennen wir noch nicht.</p>' +
      '<div class="foot"><a href="https://frenstudio.com">frenstudio.com</a></div>';
    return;
  }
  document.title = p.name + ' · Pflegekarte · fren studio';
  var m = new Date().getMonth();
  var summer = m >= 3 && m <= 8;
  var toxicTile = p.toxic
    ? '<div class="tile bad">' + ICON.warn + '<div class="t display">Giftig</div><div class="d">Außer Reichweite von Tieren &amp; Kindern</div></div>'
    : '<div class="tile good">' + ICON.shield + '<div class="t display">Ungiftig</div><div class="d">für Tiere &amp; Kinder</div></div>';

  app.innerHTML = top +
    '<div><h1 class="display">' + p.name + '</h1><div class="sub">' + p.species + '</div></div>' +
    '<section class="card">' +
      '<div class="head"><div class="icon">' + ICON.drop + '</div><h2 class="display">Jetzt gießen?</h2></div>' +
      '<p class="lead">' + p.check + '</p>' +
      '<div class="rhythm">' + ICON.cal + '<div><small>Jetzt im ' + MONTHS[m] + '</small><b>' + (summer ? p.summer : p.winter) + '</b></div></div>' +
      '<div class="note">' + p.water + '</div>' +
    '</section>' +
    '<div class="grid">' +
      '<div class="tile">' + ICON.pot + '<div class="t display">Übertopf</div><div class="d">Wasser nach <strong>15 Min.</strong> ausgießen</div></div>' +
      toxicTile +
    '</div>' +
    '<details><summary><span>Mehr zur Pflege</span>' + ICON.chev + '</summary><div class="more">' +
      p.facts.map(function (f) { return '<div class="row"><span>' + f[0] + '</span><strong>' + f[1] + '</strong></div>'; }).join('') +
      '<div class="dd"><div class="do"><strong>Do</strong>' + p.dos.map(function (s) { return '<span>' + s + '</span>'; }).join('') + '</div>' +
      '<div class="dont"><strong>Don\'t</strong>' + p.donts.map(function (s) { return '<span>' + s + '</span>'; }).join('') + '</div></div>' +
      '<div class="warn"><strong>Warnzeichen</strong>' + p.warnings.map(function (w) { return '<span><strong>' + w[0] + '</strong> → ' + w[1] + '</span>'; }).join('') + '</div>' +
    '</div></details>' +
    '<div class="foot">Gefunden über den Tag im Topf · <a href="https://frenstudio.com">frenstudio.com</a></div>';
}
render();
</script>
</body>
</html>
